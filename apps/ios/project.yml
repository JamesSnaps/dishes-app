# XcodeGen spec for the Dishes iOS app. The .xcodeproj is generated from this
# file and not committed:
#
#   brew install xcodegen
#   cd apps/ios && xcodegen generate && open Dishes.xcodeproj
#
# Targets, capabilities and Info.plist keys live here so they show up in diffs.
# Layout and habits follow Keepsake's iOS app (~/Github/keepsake/apps/ios).
name: Dishes
options:
  bundleIdPrefix: uk.collco
  deploymentTarget:
    iOS: "26.1"
    watchOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en-GB

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Keep in step with "version" in apps/web/package.json (one version for the product).
    MARKETING_VERSION: "1.60.0"
    CURRENT_PROJECT_VERSION: "1"
    # James Collard's individual membership, as Keepsake: a personal app, kept off
    # the Snapdragons company team.
    DEVELOPMENT_TEAM: C729B84RYG
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  DishesCore:
    path: Packages/DishesCore

targets:
  Dishes:
    type: application
    platform: iOS
    sources:
      - path: Dishes
      - path: Shared
      - path: WatchShared
    dependencies:
      - package: DishesCore
      - target: DishesWidgets
      # "Import to Dishes" on Safari's share sheet (RUNBOOK.md, Share extension).
      - target: DishesShare
      # The Watch app, embedded so it installs with the phone's (TODO_MOBILE.md, Watch).
      - target: DishesWatch
    scheme:
      testTargets: [DishesIntentTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.collco.dishes
        # iPhone and iPad from the first commit: most cooking happens on the iPad
        # (TODO_MOBILE.md, C1).
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Dishes/Dishes.entitlements
    info:
      path: Dishes/Info.plist
      properties:
        CFBundleDisplayName: Dishes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # OIDC redirect: dishes://auth/callback (Authelia client dishes-mobile).
        # Live Activity taps: dishes://cook?… (Shared/CookLink.swift).
        CFBundleURLTypes:
          - CFBundleURLName: uk.collco.dishes.auth
            CFBundleURLSchemes: [dishes]
        # Server for this build. Debug builds can override it in the Developer menu.
        DishesAPIBase: https://dishes.collardserver.co.uk
        # The Keychain group the sign-in tokens live in, shared with DishesShare
        # (KeychainTokenStore.dishes; the entitlement lists the same group).
        DishesKeychainGroup: $(AppIdentifierPrefix)uk.collco.dishes.shared
        # Plain http to the Mac's dev server (Debug builds' Developer menu). Doesn't
        # loosen anything for internet hosts.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # fetch: BGAppRefreshTask. remote-notification: silent "sync now" pushes (C5).
        UIBackgroundModes: [fetch, remote-notification]
        # Cooking timers are AlarmKit alarms, so they sound through silent mode and Focus.
        NSAlarmKitUsageDescription: Dishes sets your cooking timers as alarms, so they go off even when your device is on silent.
        BGTaskSchedulerPermittedIdentifiers: [uk.collco.dishes.refresh]
        # The cooking Live Activity and AlarmKit's timer countdowns (DishesWidgets).
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: Dishes takes a photo of what you cooked when you log a cook.

  # Live Activities for now: cooking mode and AlarmKit timer countdowns. Home
  # Screen widgets join it later (D4), reading the store in the App Group.
  DishesWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DishesWidgets
      - path: Shared
    # The Home Screen widgets read the App Group database and send a tick
    # straight away, signed in with the app's tokens (D4).
    dependencies:
      - package: DishesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.collco.dishes.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: DishesWidgets/DishesWidgets.entitlements
    info:
      path: DishesWidgets/Info.plist
      properties:
        CFBundleDisplayName: Dishes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DishesAPIBase: https://dishes.collardserver.co.uk
        DishesKeychainGroup: $(AppIdentifierPrefix)uk.collco.dishes.shared
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension


  # "Import to Dishes" on the share sheet: a recipe page from Safari (or any app
  # that shares a link) read in and saved by the server's web import, signed in
  # with the app's own tokens through a shared Keychain group. The recipe syncs
  # down the next time the app opens.
  DishesShare:
    type: app-extension
    platform: iOS
    sources:
      - path: DishesShare
    dependencies:
      - package: DishesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.collco.dishes.share
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: DishesShare/DishesShare.entitlements
    info:
      path: DishesShare/Info.plist
      properties:
        CFBundleDisplayName: Dishes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DishesAPIBase: https://dishes.collardserver.co.uk
        DishesKeychainGroup: $(AppIdentifierPrefix)uk.collco.dishes.shared
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            # A web page from Safari, a link or recipe shared as text, or
            # screenshots / photos of a recipe (read on the device, D3).
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 4

  # Siri, Shortcuts and Spotlight's view of the app (Dishes/Intents, Phase D1),
  # run through the system on the simulator with AppIntentsTesting (Xcode 27):
  # entity lookup, the offline outbox write, the cooking-mode deep link. A UI
  # test bundle, as the framework drives the installed app from outside.
  #
  #   xcodebuild test -project Dishes.xcodeproj -scheme Dishes \
  #     -destination 'platform=iOS Simulator,name=iPad Pro 11-inch (M5)' -derivedDataPath build/dd
  DishesIntentTests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: DishesIntentTests
    dependencies:
      - target: Dishes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.collco.dishes.intenttests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Dishes
        # AppIntentsTesting ships beside XCTest, in the platform's own frameworks.
        FRAMEWORK_SEARCH_PATHS: [$(inherited), $(PLATFORM_DIR)/Developer/Library/Frameworks]

  # The Watch app: the shopping list, tonight's meal and the cook in progress,
  # all from the phone over WatchConnectivity — the Watch never signs in itself
  # (RUNBOOK.md, "Apple Watch").
  DishesWatch:
    type: application
    platform: watchOS
    sources:
      - path: DishesWatch
      - path: WatchShared
    dependencies:
      - target: DishesWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.collco.dishes.watchkitapp
        PRODUCT_NAME: DishesWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The complication reads the Watch's copy of the list through the App Group.
        CODE_SIGN_ENTITLEMENTS: DishesWatch/DishesWatch.entitlements
    info:
      path: DishesWatch/Info.plist
      properties:
        CFBundleDisplayName: Dishes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: uk.collco.dishes
        CFBundleURLTypes:
          - CFBundleURLName: uk.collco.dishes.watch
            CFBundleURLSchemes: [dishes-watch]

  # Complications and Smart Stack cards: items left, tonight's meal, the cook in progress.
  DishesWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: DishesWatchWidgets
      - path: WatchShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.collco.dishes.watchkitapp.widgets
        CODE_SIGN_ENTITLEMENTS: DishesWatchWidgets/DishesWatchWidgets.entitlements
    info:
      path: DishesWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Dishes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
